<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Billy McComiskey — Original Compositions</title>
    <meta
      name="description"
      content="A digital archive of the original compositions of Billy McComiskey, master Irish button accordionist and National Heritage Fellow. Coming soon."
    />
    <style>
      :root {
        --green: #14401f;
        --green-dark: #0e2f16;
        --gold: #c2a45e;
        --gold-soft: #d8c088;
        --cream: #f1efe4;
        --cream-dim: rgba(241, 239, 228, 0.74);
        --cream-faint: rgba(241, 239, 228, 0.45);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        text-align: center;
        color: var(--cream);
        background:
          radial-gradient(
            120% 90% at 50% 0%,
            #1a4d27 0%,
            var(--green) 42%,
            var(--green-dark) 100%
          );
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      main {
        max-width: 40rem;
        animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        main {
          animation: none;
        }
      }
      .wordmark {
        font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
        color: var(--gold-soft);
        line-height: 1;
      }
      .wordmark .first {
        display: block;
        font-size: clamp(0.95rem, 3.6vw, 1.4rem);
        letter-spacing: 0.4em;
        text-transform: uppercase;
        padding-left: 0.4em;
      }
      .wordmark .last {
        display: block;
        font-size: clamp(2.5rem, 11vw, 4.75rem);
        letter-spacing: 0.01em;
        margin-top: 0.2em;
      }
      .rule {
        width: 3rem;
        height: 2px;
        margin: 1.9rem auto;
        background: var(--gold);
        opacity: 0.75;
      }
      .tagline {
        font-family: Georgia, 'Iowan Old Style', serif;
        font-style: italic;
        font-size: clamp(1.15rem, 3.8vw, 1.6rem);
        color: var(--cream);
        margin-bottom: 1.1rem;
      }
      .lede {
        font-size: clamp(1rem, 2.6vw, 1.15rem);
        line-height: 1.75;
        color: var(--cream-dim);
        max-width: 34rem;
        margin: 0 auto;
      }
      .soon {
        margin-top: 2.75rem;
        font-size: 0.78rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--gold-soft);
      }
      .foot {
        margin-top: 3.25rem;
        font-size: 0.85rem;
        color: var(--cream-faint);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="wordmark">
        <span class="first">Billy</span>
        <span class="last">McComiskey</span>
      </div>
      <div class="rule" aria-hidden="true"></div>
      <p class="tagline">A digital archive of his original compositions</p>
      <p class="lede">
        The tunes, the sheet music, and the stories behind them, from a master
        Irish button accordionist and National Heritage Fellow. Gathered in one
        place, free for players and listeners everywhere.
      </p>
      <p class="soon">Coming soon</p>
      <p class="foot">© Billy McComiskey</p>
    </main>
  </body>
</html>
